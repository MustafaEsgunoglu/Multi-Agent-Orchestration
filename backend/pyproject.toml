[project]
name = "orchestrator-backend"
version = "0.1.0"
description = "Multi-Tenant Multi-Agent No-Code Orchestration Platform Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "cryptography>=44.0.0,<46.0.0",
    "PyJWT>=2.10.0,<3.0.0",
    "bcrypt>=4.2.0,<5.0.0",
    "redis>=5.2.0,<6.0.0",
    "celery>=5.4.0,<6.0.0",
    "httpx>=0.28.0,<1.0.0",
]

[project.optional-dependencies]
# Phase 2+ orchestration & RAG dependencies (kept lean, <1GB RAM footprint)
engine = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.0",
    "litellm>=1.55.0",
    "pymupdf>=1.25.0",
    "langfuse>=2.55.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]
